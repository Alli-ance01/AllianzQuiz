<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta property="og:title" content="Dashboard - AllianzQuiz">
    <meta property="og:description" content="Access your quizzes and track your progress on AllianzQuiz.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dashboard - AllianzQuiz">
    <meta name="twitter:description" content="Access your quizzes and track your progress on AllianzQuiz.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <div class="brand">
                <span>🎓</span> AllianzQuiz
            </div>
            <!-- Desktop nav links -->
            <div class="nav-links">
                <a href="leaderboard.html" class="btn btn-secondary nav-link-btn">🏆 Leaderboards</a>
                <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
                <button onclick="logout()" class="btn btn-secondary nav-link-btn" aria-label="Logout">Logout</button>
            </div>
            <!-- Mobile: theme toggle always visible + hamburger -->
            <div class="nav-mobile-controls">
                <button id="themeToggleBtnMobile" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
        <!-- Mobile dropdown drawer -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="leaderboard.html" class="mobile-menu-item">🏆 Leaderboards</a>
            <button onclick="logout()" class="mobile-menu-item mobile-menu-btn" aria-label="Logout">🚪 Logout</button>
        </div>
    </nav>
    <main class="container" style="margin-top: 2rem; padding-bottom: 2rem;">
        <div class="dashboard-header">
            <div>
                <h1 id="welcomeMsg">Welcome back!</h1>
                <p>Ready to test your knowledge?</p>
            </div>
            <div class="user-info">
                <div id="userAvatar" class="avatar">U</div>
                <div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <div id="userName" style="font-weight: 600;">User</div>
                        <button onclick="editProfile()" style="background: none; border: none; cursor: pointer; color: var(--primary-color); font-size: 0.8rem;" aria-label="Edit Profile">✏️ Edit</button>
                    </div>
                    <div id="userEmail" style="font-size: 0.8rem; color: grey;">user@example.com</div>
                    <button onclick="changePassword()" style="background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.75rem; padding: 0; margin-top: 0.2rem;" aria-label="Change Password">🔒 Change Password</button>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
            <div style="flex-grow: 1;">
                <h3 style="margin-bottom: 0.25rem;">Have a Quiz Code?</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Enter the code to access a private quiz</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="quizCodeInput" placeholder="Enter code..." aria-label="Enter quiz access code"
                    style="padding: 0.6rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-bg); color: var(--text-color); text-transform: uppercase; width: 140px; font-weight: 600; letter-spacing: 1px;">
                <button onclick="joinPrivateQuiz()" class="btn btn-primary" style="padding: 0.6rem 1rem;">Join</button>
            </div>
        </div>

        <h2 style="margin-bottom: 1.5rem;">Available Quizzes</h2>
        <div id="quizGrid" class="quiz-grid" style="margin-bottom: 3rem;"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>My History</h2>
            <button onclick="clearHistory()" class="btn btn-secondary"
                style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Clear All</button>
        </div>
        <div id="historyList" class="history-list">
        </div>
    </main>
    <script src="assets/js/data.js"></script>
    <script type="module" src="assets/js/script.js"></script>
    <script>
        // Hamburger menu toggle
        document.getElementById('hamburgerBtn').addEventListener('click', function () {
            const menu = document.getElementById('mobileMenu');
            const isOpen = menu.classList.toggle('open');
            this.classList.toggle('open', isOpen);
        });

        // Mobile theme toggle mirrors the desktop one
        document.getElementById('themeToggleBtnMobile').addEventListener('click', function () {
            let current = localStorage.getItem('cbt_theme') || 'light';
            let next = current === 'light' ? 'dark' : 'light';
            localStorage.setItem('cbt_theme', next);
            document.documentElement.setAttribute('data-theme', next);
            const icon = next === 'light' ? '🌙' : '☀️';
            document.getElementById('themeToggleBtnMobile').innerHTML = icon;
            const desktopBtn = document.getElementById('themeToggleBtn');
            if (desktopBtn) desktopBtn.innerHTML = icon;
        });

        // Close menu when clicking outside
        document.addEventListener('click', function (e) {
            const menu = document.getElementById('mobileMenu');
            const btn = document.getElementById('hamburgerBtn');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('open');
                btn.classList.remove('open');
            }
        });
    </script>
</body>

</html>
