<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta property="og:title" content="Dashboard - AllianzQuiz">
    <meta property="og:description" content="Access your quizzes and track your progress on AllianzQuiz.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dashboard - AllianzQuiz">
    <meta name="twitter:description" content="Access your quizzes and track your progress on AllianzQuiz.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <!-- Brand -->
            <a href="dashboard.html" class="brand">
                <div class="brand-icon">🎓</div>
                <span class="brand-text">Allianz<span class="brand-accent">Quiz</span></span>
            </a>

            <!-- Desktop nav links -->
            <div class="nav-links">
                <a href="leaderboard.html" class="nav-pill">
                    <span class="nav-pill-icon">🏆</span> Leaderboards
                </a>
                <button id="themeToggleBtn" class="nav-icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>

                <!-- Profile dropdown trigger -->
                <div class="nav-profile" id="navProfileDesktop">
                    <button class="nav-avatar-btn" id="navAvatarBtn" aria-label="Profile menu">
                        <span id="navAvatarInitial">U</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" style="opacity:0.6"><path d="M6 8L1 3h10z"/></svg>
                    </button>
                    <div class="nav-dropdown" id="navDropdown">
                        <div class="nav-dropdown-header">
                            <div class="nav-dropdown-avatar" id="navDropdownAvatar">U</div>
                            <div>
                                <div class="nav-dropdown-name" id="navDropdownName">User</div>
                                <div class="nav-dropdown-email" id="navDropdownEmail">user@example.com</div>
                            </div>
                        </div>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="editProfile(); closeNavDropdown();" class="nav-dropdown-item">✏️ Edit Profile</button>
                        <button onclick="changePassword(); closeNavDropdown();" class="nav-dropdown-item">🔒 Change Password</button>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="logout()" class="nav-dropdown-item nav-dropdown-logout">🚪 Logout</button>
                    </div>
                </div>
            </div>

            <!-- Mobile controls -->
            <div class="nav-mobile-controls">
                <button id="themeToggleBtnMobile" class="nav-icon-btn theme-toggle" aria-label="Toggle theme">🌙</button>
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>

        <!-- Mobile drawer -->
        <div class="mobile-menu" id="mobileMenu">
            <div class="mobile-menu-profile">
                <div class="mobile-menu-avatar" id="mobileMenuAvatar">U</div>
                <div>
                    <div class="mobile-menu-name" id="mobileMenuName">User</div>
                    <div class="mobile-menu-email" id="mobileMenuEmail">user@example.com</div>
                </div>
            </div>
            <div class="mobile-menu-divider"></div>
            <a href="leaderboard.html" class="mobile-menu-item">
                <span class="mobile-menu-icon">🏆</span> Leaderboards
            </a>
            <button onclick="editProfile(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">✏️</span> Edit Profile
            </button>
            <button onclick="changePassword(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">🔒</span> Change Password
            </button>
            <div class="mobile-menu-divider"></div>
            <button onclick="logout()" class="mobile-menu-item mobile-menu-btn mobile-menu-logout">
                <span class="mobile-menu-icon">🚪</span> Logout
            </button>
        </div>
    </nav>
    <main class="container" style="margin-top: 2rem; padding-bottom: 2rem;">
        <div class="dashboard-header">
            <div>
                <h1 id="welcomeMsg">Welcome back!</h1>
                <p>Ready to test your knowledge?</p>
            </div>
            <div class="user-info">
                <div id="userAvatar" class="avatar">U</div>
                <div>
                    <div id="userName" style="font-weight: 600;">User</div>
                    <div id="userEmail" style="font-size: 0.8rem; color: var(--text-muted);">user@example.com</div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
            <div style="flex-grow: 1;">
                <h3 style="margin-bottom: 0.25rem;">Have a Quiz Code?</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Enter the code to access a private quiz</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="quizCodeInput" placeholder="Enter code..." aria-label="Enter quiz access code"
                    style="padding: 0.6rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-bg); color: var(--text-color); text-transform: uppercase; width: 140px; font-weight: 600; letter-spacing: 1px;">
                <button onclick="joinPrivateQuiz()" class="btn btn-primary" style="padding: 0.6rem 1rem;">Join</button>
            </div>
        </div>

        <h2 style="margin-bottom: 1.5rem;">Available Quizzes</h2>
        <div id="quizGrid" class="quiz-grid" style="margin-bottom: 3rem;"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>My History</h2>
            <button onclick="clearHistory()" class="btn btn-secondary"
                style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Clear All</button>
        </div>
        <div id="historyList" class="history-list">
        </div>
    </main>
    <script src="assets/js/data.js"></script>
    <script type="module" src="assets/js/script.js"></script>
    <script type="module">
        import { initNavigation } from './assets/js/nav-handler.js';
        initNavigation();
    </script>
</body>

</html>
