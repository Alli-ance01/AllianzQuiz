<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllianzQuiz - Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-color);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-toggle {
            display: flex;
            background: var(--bg-color);
            padding: 0.3rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .auth-toggle-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .auth-toggle-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body class="login-page">
    <button id="themeToggleBtn" class="theme-toggle"
        style="position: fixed; top: 1rem; right: 1rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);">🌙</button>

    <div class="auth-container">
        <div class="card auth-card">
            <div class="login-header">
                <div class="login-icon">🎓</div>
                <h1 id="authTitle">Sign In</h1>
                <p id="authSubtitle" style="color: var(--text-muted);">Access your quiz dashboard</p>
            </div>

            <div class="auth-toggle">
                <button class="auth-toggle-btn active" id="btnShowLogin" onclick="toggleAuth('login')">Login</button>
                <button class="auth-toggle-btn" id="btnShowSignup" onclick="toggleAuth('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginSubmit">
                    Sign In
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="hidden">
                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="e.g. John Doe" required>
                </div>
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required
                        minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--success-color);"
                    id="signupSubmit">
                    Create Account
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="index.html" style="font-size: 0.9rem; color: var(--text-muted); text-decoration: none;">← Back
                    to Home</a>
            </div>
        </div>
    </div>

    <script src="assets/js/logic.js"></script>
    <script>
        function toggleAuth(mode) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const btnLogin = document.getElementById('btnShowLogin');
            const btnSignup = document.getElementById('btnShowSignup');
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                btnLogin.classList.add('active');
                btnSignup.classList.remove('active');
                title.textContent = "Sign In";
                subtitle.textContent = "Access your quiz dashboard";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                btnLogin.classList.remove('active');
                btnSignup.classList.add('active');
                title.textContent = "Create Account";
                subtitle.textContent = "Join AllianzQuiz today";
            }
        }
    </script>
    <script type="module" src="assets/js/auth-logic.js"></script>
</body>

</html>
