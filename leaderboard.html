<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta property="og:title" content="Leaderboard - AllianzQuiz">
    <meta property="og:description" content="View the top scores and rankings on AllianzQuiz.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Leaderboard - AllianzQuiz">
    <meta name="twitter:description" content="View the top scores and rankings on AllianzQuiz.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            background: var(--secondary-bg);
            color: var(--secondary-text);
        }

        .rank-1 { background: #FCD34D; color: #92400E; }
        .rank-2 { background: #E5E7EB; color: #374151; }
        .rank-3 { background: #FDBA74; color: #9A3412; }
    </style>
</head>

<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <!-- Brand -->
            <a href="dashboard.html" class="brand">
                <div class="brand-icon">🎓</div>
                <span class="brand-text">Allianz<span class="brand-accent">Quiz</span></span>
            </a>

            <!-- Desktop nav links -->
            <div class="nav-links">
                <a href="dashboard.html" class="nav-pill">
                    Dashboard
                </a>
                <button id="themeToggleBtn" class="nav-icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>

                <!-- Profile dropdown trigger -->
                <div class="nav-profile" id="navProfileDesktop">
                    <button class="nav-avatar-btn" id="navAvatarBtn" aria-label="Profile menu">
                        <span id="navAvatarInitial">U</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" style="opacity:0.6"><path d="M6 8L1 3h10z"/></svg>
                    </button>
                    <div class="nav-dropdown" id="navDropdown">
                        <div class="nav-dropdown-header">
                            <div class="nav-dropdown-avatar" id="navDropdownAvatar">U</div>
                            <div>
                                <div class="nav-dropdown-name" id="navDropdownName">User</div>
                                <div class="nav-dropdown-email" id="navDropdownEmail">user@example.com</div>
                            </div>
                        </div>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="editProfile(); closeNavDropdown();" class="nav-dropdown-item">✏️ Edit Profile</button>
                        <button onclick="changePassword(); closeNavDropdown();" class="nav-dropdown-item">🔒 Change Password</button>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="logout()" class="nav-dropdown-item nav-dropdown-logout">🚪 Logout</button>
                    </div>
                </div>
            </div>

            <!-- Mobile controls -->
            <div class="nav-mobile-controls">
                <button id="themeToggleBtnMobile" class="nav-icon-btn theme-toggle" aria-label="Toggle theme">🌙</button>
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>

        <!-- Mobile drawer -->
        <div class="mobile-menu" id="mobileMenu">
            <div class="mobile-menu-profile">
                <div class="mobile-menu-avatar" id="mobileMenuAvatar">U</div>
                <div>
                    <div class="mobile-menu-name" id="mobileMenuName">User</div>
                    <div class="mobile-menu-email" id="mobileMenuEmail">user@example.com</div>
                </div>
            </div>
            <div class="mobile-menu-divider"></div>
            <a href="dashboard.html" class="mobile-menu-item">
                Dashboard
            </a>
            <button onclick="editProfile(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">✏️</span> Edit Profile
            </button>
            <button onclick="changePassword(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">🔒</span> Change Password
            </button>
            <div class="mobile-menu-divider"></div>
            <button onclick="logout()" class="mobile-menu-item mobile-menu-btn mobile-menu-logout">
                <span class="mobile-menu-icon">🚪</span> Logout
            </button>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem; padding-bottom: 4rem; max-width: 900px;">
        <div class="dashboard-header" style="flex-direction: row; justify-content: space-between;">
            <div>
                <h1 style="display: flex; align-items: center; gap: 0.5rem;">🏆 Leaderboard</h1>
                <p style="color: var(--text-muted);">See how you stack up against the competition</p>
            </div>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
            <div style="margin-bottom: 1.5rem;">
                <label style="font-weight: 500; margin-bottom: 0.5rem; display: block;">Select Quiz</label>
                <select id="quizSelector" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; background: var(--input-bg); color: var(--text-color); font-size: 1rem;">
                    <option value="">-- Select a quiz to view rankings --</option>
                </select>
            </div>

            <div style="overflow-x: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">Rank</th>
                            <th>Student</th>
                            <th>Score</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                                Select a quiz to view the leaderboard.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/js/data.js?v=6"></script>
    <script type="module" src="assets/js/leaderboard.js?v=6"></script>
    <script type="module">
        import { initNavigation } from './assets/js/nav-handler.js?v=6';
        initNavigation();
    </script>
</body>

</html>
