<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta property="og:title" content="Quiz Results - AllianzQuiz">
    <meta property="og:description" content="Check your quiz results on the AllianzQuiz professional CBT platform.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quiz Results - AllianzQuiz">
    <meta name="twitter:description" content="Check your quiz results on the AllianzQuiz professional CBT platform.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <div class="brand">
                <span>🎓</span> AllianzQuiz Results
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button id="themeToggleBtn" class="theme-toggle">🌙</button>
                <a href="dashboard.html" class="btn" style="color: grey; font-size: 0.9rem;">Back</a>
            </div>
        </div>
    </nav>
    <main class="container" style="max-width: 800px; margin-top: 3rem; padding-bottom: 3rem;">
        <div class="card" style="text-align: center; margin-bottom: 2rem;">
            <div id="scoreCircle" class="score-circle">--%</div>
            <h1 id="resultTitle" style="margin-bottom: 0.5rem;">Completed!</h1>
            <p id="resultSummary" style="color: grey; font-size: 1.1rem; margin-bottom: 2rem;">Loading...</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="dashboard.html" class="btn btn-secondary">Home</a>
                <button onclick="window.print()" class="btn btn-primary">Print</button>
            </div>
        </div>
        <h2 style="margin-bottom: 1.5rem;">Review</h2>
        <div id="reviewContainer"></div>
    </main>
    <script type="module">
        import { getSubmissionById } from './assets/js/firebase-db.js';
        import { onAuthChange } from './assets/js/firebase-auth.js';

        // Apply theme
        function applyTheme() {
            let saved = localStorage.getItem('cbt_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            let btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerHTML = saved === 'light' ? '🌙' : '☀️';
        }
        applyTheme();

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            let current = localStorage.getItem('cbt_theme') || 'light';
            let next = current === 'light' ? 'dark' : 'light';
            localStorage.setItem('cbt_theme', next);
            applyTheme();
        });

        async function renderResult() {
            const params = new URLSearchParams(window.location.search);
            const submissionId = params.get('id');

            let res = null;

            if (submissionId) {
                try {
                    res = await getSubmissionById(submissionId);
                } catch (error) {
                    console.error('Error fetching submission:', error);
                }
            }

            if (!res) {
                const resultStr = localStorage.getItem('cbt_last_result');
                if (resultStr) {
                    res = JSON.parse(resultStr);
                }
            }

            if (!res) {
                window.location.href = 'dashboard.html';
                return;
            }

            const percentage = res.percentage;
            const isPass = percentage >= 50;
            const circle = document.getElementById('scoreCircle');
            circle.textContent = percentage + "%";

            circle.classList.remove('pass', 'fail');
            if (isPass) {
                circle.classList.add('pass');
            } else {
                circle.classList.add('fail');
            }

            let titleText = isPass ? 'Great Job!' : 'Keep Practicing!';
            if (res.pending > 0) titleText = "Submitted!";
            document.getElementById('resultTitle').textContent = titleText;

            let summaryHtml = "You scored " + res.score + " out of " + res.total + " correctly.";
            if (res.timeTaken) {
                summaryHtml += ` <br><span style="font-size: 0.9rem; opacity: 0.8;">Time Taken: ${res.timeTaken}</span>`;
            }
            if (res.pending > 0) {
                summaryHtml += ` <br><span style="color: var(--warning-color); font-weight: 600;">(${res.pending} items pending manual review)</span>`;
            }
            document.getElementById('resultSummary').innerHTML = summaryHtml;

            const container = document.getElementById('reviewContainer');
            let html = "";

            if (res.details && res.details.length > 0) {
                for (let i = 0; i < res.details.length; i++) {
                    const item = res.details[i];
                    const statusClass = 'status-' + item.status;
                    const statusText = item.status.charAt(0).toUpperCase() + item.status.slice(1);

                    html += '<div class="review-card">' +
                        '<div class="review-header">' +
                        '<span style="opacity: 0.6;">Q' + (i + 1) + '.</span>' +
                        '<span style="flex-grow: 1;">' + item.text + '</span>' +
                        '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                        '</div>' +
                        '<div class="answer-row">' +
                        '<div><span class="answer-label">Your Answer:</span> <span class="answer-value">' + (item.selectedOption || 'Skipped') + '</span></div>' +
                        (item.status !== 'pending' && !item.isCorrect ? '<div><span class="answer-label">Correct Answer:</span> <span class="correct-value">' + item.correctKey + '</span></div>' : '') +
                        '</div>' +
                        '</div>';
                }
            } else {
                html = '<p style="color: var(--text-muted);">No detailed review available.</p>';
            }

            container.innerHTML = html;

            if (isPass) {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function () {
                    const timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }

        onAuthChange(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            await renderResult();
        });
    </script>
</body>

</html>
