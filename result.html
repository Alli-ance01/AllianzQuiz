<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta property="og:title" content="Quiz Results - AllianzQuiz">
    <meta property="og:description" content="Check your quiz results on the AllianzQuiz professional CBT platform.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quiz Results - AllianzQuiz">
    <meta name="twitter:description" content="Check your quiz results on the AllianzQuiz professional CBT platform.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <!-- Brand -->
            <a href="dashboard.html" class="brand">
                <div class="brand-icon">🎓</div>
                <span class="brand-text">Allianz<span class="brand-accent">Quiz</span> Results</span>
            </a>

            <!-- Desktop nav links -->
            <div class="nav-links">
                <a href="dashboard.html" class="nav-pill">
                    Dashboard
                </a>
                <button id="themeToggleBtn" class="nav-icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>

                <!-- Profile dropdown trigger -->
                <div class="nav-profile" id="navProfileDesktop">
                    <button class="nav-avatar-btn" id="navAvatarBtn" aria-label="Profile menu">
                        <span id="navAvatarInitial">U</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" style="opacity:0.6"><path d="M6 8L1 3h10z"/></svg>
                    </button>
                    <div class="nav-dropdown" id="navDropdown">
                        <div class="nav-dropdown-header">
                            <div class="nav-dropdown-avatar" id="navDropdownAvatar">U</div>
                            <div>
                                <div class="nav-dropdown-name" id="navDropdownName">User</div>
                                <div class="nav-dropdown-email" id="navDropdownEmail">user@example.com</div>
                            </div>
                        </div>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="editProfile(); closeNavDropdown();" class="nav-dropdown-item">✏️ Edit Profile</button>
                        <button onclick="changePassword(); closeNavDropdown();" class="nav-dropdown-item">🔒 Change Password</button>
                        <div class="nav-dropdown-divider"></div>
                        <button onclick="logout()" class="nav-dropdown-item nav-dropdown-logout">🚪 Logout</button>
                    </div>
                </div>
            </div>

            <!-- Mobile controls -->
            <div class="nav-mobile-controls">
                <button id="themeToggleBtnMobile" class="nav-icon-btn theme-toggle" aria-label="Toggle theme">🌙</button>
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>

        <!-- Mobile drawer -->
        <div class="mobile-menu" id="mobileMenu">
            <div class="mobile-menu-profile">
                <div class="mobile-menu-avatar" id="mobileMenuAvatar">U</div>
                <div>
                    <div class="mobile-menu-name" id="mobileMenuName">User</div>
                    <div class="mobile-menu-email" id="mobileMenuEmail">user@example.com</div>
                </div>
            </div>
            <div class="mobile-menu-divider"></div>
            <a href="dashboard.html" class="mobile-menu-item">
                Dashboard
            </a>
            <button onclick="editProfile(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">✏️</span> Edit Profile
            </button>
            <button onclick="changePassword(); closeMobileMenu();" class="mobile-menu-item mobile-menu-btn">
                <span class="mobile-menu-icon">🔒</span> Change Password
            </button>
            <div class="mobile-menu-divider"></div>
            <button onclick="logout()" class="mobile-menu-item mobile-menu-btn mobile-menu-logout">
                <span class="mobile-menu-icon">🚪</span> Logout
            </button>
        </div>
    </nav>
    <main class="container" style="max-width: 800px; margin-top: 3rem; padding-bottom: 3rem;">
        <div class="card" style="text-align: center; margin-bottom: 2rem;">
            <div id="scoreCircle" class="score-circle">--%</div>
            <h1 id="resultTitle" style="margin-bottom: 0.5rem;">Completed!</h1>
            <p id="resultSummary" style="color: grey; font-size: 1.1rem; margin-bottom: 2rem;">Loading...</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="dashboard.html" class="btn btn-secondary" aria-label="Go to home">Home</a>
                <button onclick="window.print()" class="btn btn-primary" aria-label="Print results">Print</button>
            </div>
        </div>
        <h2 style="margin-bottom: 1.5rem;">Review</h2>
        <div id="reviewContainer"></div>
    </main>
    <script type="module">
        import { getSubmissionById } from './assets/js/firebase-db.js';
        import { onAuthChange, getUserProfile } from './assets/js/firebase-auth.js';
        import { setupStatusMonitoring } from './assets/js/logic.js';

        function applyTheme() {
            let saved = localStorage.getItem('cbt_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            let btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerHTML = saved === 'light' ? '🌙' : '☀️';
        }
        applyTheme();

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            let current = localStorage.getItem('cbt_theme') || 'light';
            let next = current === 'light' ? 'dark' : 'light';
            localStorage.setItem('cbt_theme', next);
            applyTheme();
        });

        async function renderResult() {
            const params = new URLSearchParams(window.location.search);
            const submissionId = params.get('id');

            let res = null;

            if (submissionId) {
                try {
                    res = await getSubmissionById(submissionId);
                } catch (error) {
                    console.error('Error fetching submission:', error);
                }
            }

            if (!res) {
                const resultStr = localStorage.getItem('cbt_last_result');
                if (resultStr) {
                    res = JSON.parse(resultStr);
                }
            }

            if (!res) {
                window.location.href = 'dashboard.html';
                return;
            }

            const percentage = res.percentage;
            const isPass = percentage >= 50;
            const circle = document.getElementById('scoreCircle');
            circle.textContent = percentage + "%";

            circle.classList.remove('pass', 'fail');
            if (isPass) {
                circle.classList.add('pass');
            } else {
                circle.classList.add('fail');
            }

            let titleText = isPass ? 'Great Job!' : 'Keep Practicing!';
            if (res.pending > 0) titleText = "Submitted!";
            document.getElementById('resultTitle').textContent = titleText;

            let summaryHtml = "You scored " + res.score + " out of " + res.total + " correctly.";
            if (res.timeTaken) {
                summaryHtml += ` <br><span style="font-size: 0.9rem; opacity: 0.8;">Time Taken: ${res.timeTaken}</span>`;
            }
            if (res.pending > 0) {
                summaryHtml += ` <br><span style="color: var(--warning-color); font-weight: 600;">(${res.pending} items pending manual review)</span>`;
            }
            document.getElementById('resultSummary').innerHTML = summaryHtml;

            const container = document.getElementById('reviewContainer');
            let html = "";

            if (res.details && res.details.length > 0) {
                for (let i = 0; i < res.details.length; i++) {
                    const item = res.details[i];
                    const statusClass = 'status-' + item.status;
                    const statusText = item.status.charAt(0).toUpperCase() + item.status.slice(1);

                    html += '<div class="review-card">' +
                        '<div class="review-header">' +
                        '<span style="opacity: 0.6;">Q' + (i + 1) + '.</span>' +
                        '<span style="flex-grow: 1;">' + item.text + '</span>' +
                        '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                        '</div>' +
                        '<div class="answer-row">' +
                        '<div><span class="answer-label">Your Answer:</span> <span class="answer-value">' + (item.selectedOption || 'Skipped') + '</span></div>' +
                        (item.status !== 'pending' && !item.isCorrect ? '<div><span class="answer-label">Correct Answer:</span> <span class="correct-value">' + item.correctKey + '</span></div>' : '') +
                        '</div>' +
                        (item.explanation ? '<div style="margin-top: 1rem; padding: 0.75rem; background: rgba(79, 70, 229, 0.05); border-left: 3px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem;"><strong>Explanation:</strong> ' + item.explanation + '</div>' : '') +
                        '</div>';
                }
            } else {
                html = '<p style="color: var(--text-muted);">No detailed review available.</p>';
            }

            container.innerHTML = html;

            if (isPass) {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function () {
                    const timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }



        onAuthChange(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Start monitoring status in real-time
            setupStatusMonitoring(user);

            // Update Nav Profile
            const profile = await getUserProfile(user.uid);
            if (profile && typeof window.updateNavProfile === 'function') {
                window.updateNavProfile(profile.displayName, profile.email);
            }

            // Verify status immediately
            if (profile && profile.disabled) {
                const { signOutUser } = await import('./assets/js/firebase-auth.js');
                await signOutUser();
                window.location.href = 'index.html';
                return;
            }

            await renderResult();
        });

        import { initNavigation } from './assets/js/nav-handler.js?v=6';
        initNavigation();
    </script>
</body>

</html>
