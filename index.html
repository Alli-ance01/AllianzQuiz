<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllianzQuiz - Online CBT Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="login-page">
    <button id="themeToggleBtn" class="theme-toggle"
        style="position: fixed; top: 1rem; right: 1rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);">🌙</button>

    <div class="card login-card">
        <div class="login-header">
            <div class="login-icon">🎓</div>
            <h1>Welcome to AllianzQuiz</h1>
            <p style="color: var(--text-muted);">Enter your details to start testing your knowledge.</p>
        </div>

        <div style="display: grid; gap: 1rem;">
            <a href="auth.html" class="btn btn-primary" style="text-align: center; padding: 1rem;">
                Get Started
            </a>
            <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                Securely synced with Firebase Cloud
            </p>
        </div>
    </div>

    <script src="assets/js/logic.js"></script>
    <script type="module" src="assets/js/auth-status.js"></script>
</body>

</html>
