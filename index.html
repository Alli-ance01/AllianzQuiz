<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllianzQuiz - Online CBT Platform</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <!-- SEO / Open Graph / Twitter -->
    <meta name="description"
        content="AllianzQuiz - A professional online CBT platform for mastering your Allianz knowledge.">

    <meta property="og:title" content="AllianzQuiz - Online CBT Platform">
    <meta property="og:description" content="Master your Allianz knowledge with our professional online CBT platform.">
    <meta property="og:image" content="assets/img/og-image.png">
    <meta property="og:url" content="https://allianz-quiz.web.app">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AllianzQuiz - Online CBT Platform">
    <meta name="twitter:description" content="Master your Allianz knowledge with our professional online CBT platform.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AllianzQuiz",
        "url": "https://allianz-quiz.web.app",
        "description": "A professional online CBT platform for mastering your Allianz knowledge.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "publisher": {
            "@type": "Organization",
            "name": "AllianzQuiz",
            "logo": {
                "@type": "ImageObject",
                "url": "https://allianz-quiz.web.app/assets/img/logo.png"
            }
        }
    }
    </script>
</head>

<body class="login-page">
    <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle dark mode"
        style="position: fixed; top: 1rem; right: 1rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);">🌙</button>

    <div class="card login-card">
        <div class="login-header">
            <div class="login-icon">🎓</div>
            <h1 id="formTitle">Welcome to AllianzQuiz</h1>
            <p style="color: var(--text-muted);" id="formSubtitle">Sign in to continue</p>
        </div>

        <div class="auth-toggle"
            style="display: flex; margin-bottom: 1.5rem; background: var(--bg-color); border-radius: 12px; padding: 0.25rem;">
            <button type="button" id="signInTab" class="auth-tab active" onclick="switchAuthMode('signin')">Sign
                In</button>
            <button type="button" id="signUpTab" class="auth-tab" onclick="switchAuthMode('signup')">Sign Up</button>
        </div>

        <form id="loginForm">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="e.g. John Doe">
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="••••••••" required minlength="6"
                        style="padding-right: 3rem; width: 100%;">
                    <button type="button" id="togglePassword" aria-label="Toggle password visibility"
                        style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.25rem;">👁️</button>
                </div>
            </div>

            <div class="input-group" id="roleGroup" style="display: none;">
                <label>I am a...</label>
                <div class="role-selector" style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                    <button type="button" class="role-btn selected" data-role="student" onclick="selectRole('student')">
                        📚 Student
                    </button>
                    <button type="button" class="role-btn" data-role="admin" onclick="selectRole('admin')">
                        👨‍🏫 Admin/Teacher
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
                Sign In
            </button>
        </form>
    </div>

    <script type="module" src="assets/js/logic.js"></script>
</body>

</html>
