<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - AllianzQuiz</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">

    <meta property="og:title" content="Quiz - AllianzQuiz">
    <meta property="og:description" content="Take your quiz on the AllianzQuiz professional CBT platform.">
    <meta property="og:image" content="assets/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quiz - AllianzQuiz">
    <meta name="twitter:description" content="Take your quiz on the AllianzQuiz professional CBT platform.">
    <meta name="twitter:image" content="assets/img/og-image.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="padding-top: 60px;" class="no-select">
    <div class="timer-badge" id="timerDisplay" aria-live="polite" aria-label="Quiz timer">00:00</div>
    <nav class="main-nav" style="position: fixed; top: 0; width: 100%; z-index: 90; height: 60px;">
        <div class="container nav-content">
            <div style="font-weight: 600;" id="quizTitle">Loading...</div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="calcToggleBtn" class="theme-toggle" aria-label="Toggle calculator">🧮</button>
                <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
                <div style="font-size: 0.9rem;">Q <span id="currentQNum">1</span> / <span id="totalQNum">0</span></div>
            </div>
        </div>
    </nav>
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <main class="container quiz-layout" id="quizMainContent" style="display: none;">
        <aside class="question-palette">
            <h3>Palette</h3>
            <div id="paletteGrid" class="palette-grid"></div>
            <button onclick="submitQ()" class="btn" aria-label="Submit quiz"
                style="width: 100%; margin-top: 2rem; border: 2px solid red; color: red;">Submit</button>
        </aside>
        <section class="question-area">
            <h2 id="questionText" style="margin-bottom: 1.5rem;">Loading...</h2>
            <div id="optionsContainer" class="option-group"></div>
            <div class="nav-controls">
                <button onclick="prevQ()" id="prevBtn" class="btn" aria-label="Previous question">Prev</button>
                <button onclick="toggleFlag()" id="flagBtn" class="btn" aria-label="Flag question for review"
                    style="background: #FEF3C7; color: #92400E;">Flag</button>
                <button onclick="nextQ()" id="nextBtn" class="btn btn-primary" aria-label="Next question">Next</button>
            </div>
        </section>
    </main>

    <div id="calculatorWidget" class="calculator-widget" style="display: none;">
        <div class="calc-header" id="calcHeader">
            <span>Calculator</span>
            <button id="closeCalc" class="calc-close">&times;</button>
        </div>
        <div class="calc-display-area">
            <input type="text" id="calcDisplay" readonly value="0">
        </div>
        <div class="calc-buttons">
            <button class="calc-btn utility" onclick="calcAction('AC')">AC</button>
            <button class="calc-btn utility" onclick="calcAction('DEL')">DEL</button>
            <button class="calc-btn operator" onclick="calcAction('/')">÷</button>
            <button class="calc-btn operator" onclick="calcAction('*')">×</button>

            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            <button class="calc-btn operator" onclick="calcAction('-')">-</button>

            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn operator" onclick="calcAction('+')">+</button>

            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>
            <button class="calc-btn equal" onclick="calcAction('=')">=</button>

            <button class="calc-btn" onclick="calcAction('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/calculator.js"></script>
    <script type="module" src="assets/js/quiz.js"></script>
</body>

</html>
